name: Node.js CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: 'src/backend/package.json'
      
      - name: Install dependencies
        working-directory: src/backend
        run: npm ci
      
      - name: Run linting
        working-directory: src/backend
        run: npm run lint
      
      - name: Run unit tests
        working-directory: src/backend
        run: npm run test:unit
      
      - name: Run integration tests
        working-directory: src/backend
        run: npm run test:integration
      
      - name: Check code coverage
        working-directory: src/backend
        run: npm run test:coverage

  docker_build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/node-hello-world
          tags: |
            type=sha
            type=ref,event=branch
            latest
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./infrastructure/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ docker_build ]
    if: "github.event_name == 'push' || github.event.inputs.environment == 'staging'"
    environment:
      name: staging
      url: http://staging.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Deploy to staging server
        run: bash ./infrastructure/scripts/deploy.sh staging
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/node-hello-world:latest
      
      - name: Verify deployment
        run: bash ./infrastructure/scripts/healthcheck.sh
        env:
          HOST: staging.example.com
          PORT: 80
          TIMEOUT: 30

  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ deploy_staging ]
    if: "github.event.inputs.environment == 'production'"
    environment:
      name: production
      url: http://example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Deploy to production server
        run: bash ./infrastructure/scripts/deploy.sh production
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/node-hello-world:latest
      
      - name: Verify deployment
        run: bash ./infrastructure/scripts/healthcheck.sh
        env:
          HOST: example.com
          PORT: 80
          TIMEOUT: 30